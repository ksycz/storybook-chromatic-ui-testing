name: E2E (Playwright + Chromatic)

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full history to find the baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: chromaui/action@v18
        with:
          playwright: true # upload the page archives captured by the Playwright tests
          projectToken: ${{ secrets.CHROMATIC_PLAYWRIGHT_TOKEN }}
          exitZeroOnChanges: true # visual changes wait for review in Chromatic instead of failing the job
          autoAcceptChanges: main # merged changes become the new baseline
